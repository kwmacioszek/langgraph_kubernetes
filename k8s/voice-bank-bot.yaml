apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-bank-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voice-bank-bot
  template:
    metadata:
      labels:
        app: voice-bank-bot
    spec:
      containers:
        - name: voice-bank-bot
          image: voice-bank-bot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8020
          envFrom:
            - secretRef:
                name: voice-bank-bot-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet: { path: /health, port: 9999 }
            initialDelaySeconds: 2
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /ready, port: 8020 }
            initialDelaySeconds: 2
            periodSeconds: 20
          livenessProbe:
            httpGet: { path: /health, port: 8020 }
            initialDelaySeconds: 5
            periodSeconds: 20
          volumeMounts:
            - name: uploads
              mountPath: /app/data/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: voice-bank-bot-uploads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: voice-bank-bot-uploads
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: voice-bank-bot
spec:
  selector:
    app: voice-bank-bot
  ports:
    - port: 80
      targetPort: 8020
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voice-bank-bot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voice-bank-bot
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
